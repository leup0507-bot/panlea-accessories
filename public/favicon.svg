<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <clipPath id="roundClip">
      <rect width="512" height="512" rx="110" ry="110"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundClip)">
    <!-- Background -->
    <rect width="512" height="512" fill="url(#bgGrad)"/>

    <!-- Abstract shopping bag: minimal trapezoid shape -->
    <!-- Bag body: slightly wider at bottom, rounded corners -->
    <path d="
      M 136,210
      C 136,196 146,186 160,186
      L 352,186
      C 366,186 376,196 376,210
      L 396,370
      C 398,386 386,400 370,400
      L 142,400
      C 126,400 114,386 116,370
      Z
    " fill="#2a2a2a"/>

    <!-- Handle: two elegant arcs, thin lines -->
    <!-- Left arc -->
    <path d="M 196,186 C 196,186 196,136 196,126 C 196,100 220,82 256,82 C 292,82 316,100 316,126 C 316,136 316,186 316,186" 
      fill="none" stroke="#3a3a3a" stroke-width="22" stroke-linecap="round"/>
    <!-- Handle inner cutout to make it a ring -->
    <path d="M 196,186 C 196,186 196,136 196,126 C 196,100 220,82 256,82 C 292,82 316,100 316,126 C 316,136 316,186 316,186" 
      fill="none" stroke="#1c1c1c" stroke-width="10" stroke-linecap="round"/>

    <!-- H letterform: white, clean, slightly condensed, punched out of bag -->
    <!-- Left stem -->
    <rect x="172" y="220" width="48" height="152" rx="5" fill="white"/>
    <!-- Right stem -->
    <rect x="292" y="220" width="48" height="152" rx="5" fill="white"/>
    <!-- Crossbar -->
    <rect x="172" y="278" width="168" height="36" rx="5" fill="white"/>

    <!-- Very subtle bottom edge shine on bag -->
    <rect x="136" y="392" width="240" height="2" rx="1" fill="white" opacity="0.06" transform="translate(68,0)"/>
  </g>
</svg>
