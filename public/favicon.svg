<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8820C"/>
      <stop offset="50%" stop-color="#D4580A"/>
      <stop offset="100%" stop-color="#B83D08"/>
    </linearGradient>
    <!-- Subtle inner light top-left -->
    <radialGradient id="shine" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="roundClip">
      <rect width="512" height="512" rx="115" ry="115"/>
    </clipPath>
  </defs>
  <g clip-path="url(#roundClip)">
    <!-- Warm orange-red gradient background -->
    <rect width="512" height="512" fill="url(#bgGrad)"/>
    <!-- Soft top-left glow for depth -->
    <rect width="512" height="512" fill="url(#shine)"/>
    <!-- Bold white H -->
    <rect x="108" y="98" width="104" height="316" rx="14" fill="white"/>
    <rect x="300" y="98" width="104" height="316" rx="14" fill="white"/>
    <rect x="108" y="214" width="296" height="84" rx="14" fill="white"/>
  </g>
</svg>
